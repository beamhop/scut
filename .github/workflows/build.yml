name: build
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          build-args: REGISTRY=
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/beamhop/scut-agent:${{ github.sha }}
            ghcr.io/beamhop/scut-agent:latest
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./scripts/build-image.sh
      - run: bun test tests/e2e.test.ts tests/ui.test.ts --timeout 600000
        env: { CHROME: /usr/bin/google-chrome }
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: scut-apps, path: dist/scut-* }
